<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; font-src data:; style-src 'nonce-__NONCE__'; script-src 'nonce-__NONCE__';"><style nonce="__NONCE__">
@font-face{font-family:Inter;font-style:normal;font-weight:400;src:url(data:font/woff2;base64,__FONT400__) format('woff2')}@font-face{font-family:Inter;font-style:normal;font-weight:600;src:url(data:font/woff2;base64,__FONT600__) format('woff2')}
*{box-sizing:border-box}body{background:#fff;color:#001840;font:14px Inter,system-ui,sans-serif;margin:0;line-height:1.4}button{background:white;color:#001840;border:1px solid #001840;border-radius:8px;min-height:48px;padding:8px 16px;font:600 13px Inter,system-ui;cursor:pointer}button:focus-visible,textarea:focus-visible{outline:2px solid #001840;outline-offset:2px}button:disabled{opacity:.65;cursor:default}header{height:80px;padding:16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #b8bfd0}header strong{font-size:18px;margin-right:0}header button{flex-shrink:1;width:112px;min-width:0}main{height:calc(100vh - 264px);min-height:200px;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:16px}h1{font-size:24px;margin:64px 0 0;font-weight:600}h2{font-size:22px;margin:0}p{margin:0}.muted,small{font-size:12px;color:#3d4a66}.card,fieldset{padding:16px;background:#f4f6fb;border:1px solid #b8bfd0;border-radius:8px;margin:0;min-width:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}footer{border-top:1px solid #b8bfd0;padding:16px;min-height:184px;display:flex;flex-direction:column;gap:8px}textarea{resize:vertical;width:100%;height:64px;min-height:64px;padding:16px;border:1px solid #848da3;border-radius:8px;background:white;color:#001840;font:14px Inter,system-ui}footer .actions{flex-wrap:nowrap}footer .actions button{max-width:104px}pre{font:13px Inter,system-ui;white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0}legend{font-weight:600}label{display:block}.primary{background:#001840;color:white}.spacer{height:64px}[hidden]{display:none!important}.sign-in{gap:24px}.hunk{background:#fff;padding:12px;margin:8px 0}.hunk pre{margin:0}.selected{background:#001840;color:white}
</style></head><body><header><strong>Tervory</strong><button id="newChat">New chat</button><button id="plugins">Plugins</button></header><main id="content"><h1>New chat</h1><p class="muted">Ask Tervory, or describe a change to build…</p></main><footer id="composer"><textarea id="text" aria-label="Message Tervory" placeholder="Ask Tervory, or describe a change to build…"></textarea><div class="actions"><button id="auto">Auto</button><button id="attach">Attach</button><button id="send">Send</button></div><small id="receipt">Receipt pending</small></footer>
<script nonce="__NONCE__">
const api=acquireVsCodeApi(),byId=id=>document.getElementById(id),area=byId('content');let waiting=false,offline=false,region='us-east';
const setComposer=disabled=>{for(const n of byId('composer').querySelectorAll('button,textarea'))n.disabled=disabled;byId('composer').style.opacity=disabled?'.65':'1';};
const send=(type,more={})=>api.postMessage({type,...more});
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;};
const button=(text,fn,primary=false)=>{const b=el('button',text,primary?'primary':'');b.onclick=fn;return b;};
function empty(){area.replaceChildren(el('h1','New chat'),el('p','Ask Tervory, or describe a change to build…','muted'));}
function card(title,text){const n=el('section',undefined,'card');n.append(el('strong',title));if(text)n.append(el('pre',text));area.append(n);return n;}
byId('newChat').onclick=()=>send('newChat');byId('plugins').onclick=()=>send('plugins');byId('attach').onclick=()=>send('attach');
byId('auto').onclick=()=>{byId('text').focus();};
byId('send').onclick=()=>{const text=byId('text').value;if(waiting||!text.trim())return;waiting=true;if(area.querySelector('h1'))area.replaceChildren();area.append(el('small','You'),el('p',text),el('small','Tervory'));send(text.trim()==='/undo'?'undo':'code',{text});byId('text').value='';};
window.addEventListener('message',({data})=>{
 if(data.type==='ready'){waiting=false;setComposer(offline);return;}
 if(data.type==='newChat'){offline=false;setComposer(false);empty();byId('receipt').textContent='Receipt pending';return;}
 if(data.type==='auth'){
  if(data.signedIn){empty();area.className='';byId('composer').hidden=false;byId('newChat').hidden=false;byId('plugins').hidden=false;return;}
  area.className='sign-in';area.replaceChildren(el('h1','Trigger sign-in'),el('p','US / ZA'));byId('composer').hidden=true;byId('newChat').hidden=true;byId('plugins').hidden=true;
  const choices=el('div',undefined,'actions');const us=button('US · selected',()=>choose('us-east')),za=button('ZA',()=>choose('za'));function choose(value){region=value;us.textContent=value==='us-east'?'US · selected':'US';za.textContent=value==='za'?'ZA · selected':'ZA';}choices.append(us,za);area.append(choices,button('Trigger sign-in',()=>send('signIn',{region})),el('pre',''));return;
 }
 if(data.type==='deviceCode'){let code=byId('deviceCode');if(!code){code=el('pre');code.id='deviceCode';area.append(code);}code.textContent=data.code;return;}
 if(data.type==='output'){let out=area.querySelector('[data-output]');if(!out){out=el('pre');out.dataset.output='true';area.append(out);}out.textContent=(out.textContent+data.text).slice(-500000);return;}
 if(data.type==='error'){if(area.querySelector('h1'))area.replaceChildren(el('small','Tervory'));const n=card(data.offline?'Offline':'Error',data.offline?'Connection lost.':data.text);n.append(el('p','No action was retried.'));offline=!!data.offline;setComposer(offline);return;}
 if(data.type==='command'){area.querySelector('[data-command]')?.remove();const n=card(data.state==='running'?'Running':'Finished',data.text);n.dataset.command='true';if(data.state==='running'){n.append(el('p','Waiting for output…'));setComposer(true);}else{n.append(el('p','Exit code: '+data.code),el('small','Output'),el('pre',data.output));setComposer(false);}return;}
 if(data.type==='approval'){const n=card(data.label,data.text);if(data.label==='Undo')n.append(el('p','Restore the last change set?'));const actions=el('div',undefined,'actions');for(const [text,approved]of [[data.action,true],['Cancel',false]])actions.append(button(text,()=>{send('approve',{id:data.id,approved});n.remove();}));n.append(actions);return;}
 if(data.type==='receipt'){const rows=data.receipt.rows||[];const sum=key=>rows.length&&rows.every(row=>typeof row[key]==='number')?rows.reduce((n,row)=>n+row[key],0):null;const money=value=>value===null?'Receipt pending':'$'+value.toFixed(2);const cost=sum('cost_usd'),baseline=sum('baseline_cost_usd'),saved=sum('saved_usd');byId('receipt').textContent='Turn receipt · '+money(cost);const n=card('Turn receipt','Model spend: '+money(cost));if(baseline!==null){n.append(el('strong','Savings'),el('p','Comparison estimate: '+money(baseline)),el('p','Saved: '+money(saved)),el('small','Estimate, not a billed amount.'));}n.append(button('View receipt',()=>send('receipt')));return;}
 if(data.type==='plugins'){area.replaceChildren(el('h2','Plugins'));for(const item of data.items)card(item.title,item.text);return;}
 if(data.type!=='review')return;area.querySelector('[data-review]')?.remove();const review=el('section');review.dataset.review='true';review.append(el('small','TERVORY · Proposed changes'));
 for(const file of data.files){const box=el('fieldset'),title=el('legend',file.name);box.append(title);const actions=el('div',undefined,'actions');actions.append(button('Accept file',()=>box.querySelectorAll('input').forEach(x=>x.checked=true),true),button('Reject file',()=>box.querySelectorAll('input').forEach(x=>x.checked=false)));box.append(actions);
 for(const [i,hunk]of file.hunks.entries()){const n=el('div',undefined,'hunk'),input=el('input');input.type='checkbox';input.dataset.index=hunk.index;input.hidden=true;const buttons=el('div',undefined,'actions');buttons.append(button('Accept hunk',()=>{input.checked=true;},true),button('Reject hunk',()=>{input.checked=false;}));n.append(el('small','Hunk '+(i+1)+' of '+file.hunks.length),input,el('pre',hunk.diff),buttons);box.append(n);}box.append(button('Review changes',()=>send('preview',{name:file.name})));review.append(box);}
 review.append(button('Accept',()=>{send('accept',{hunks:[...review.querySelectorAll('input:checked')].map(x=>Number(x.dataset.index))});review.remove();},true),button('Reject',()=>{send('accept',{hunks:[]});review.remove();}));area.append(review);
});
send('ready');
</script></body></html>
